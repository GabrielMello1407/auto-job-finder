<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>auto-job-finder</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <!-- Textos com data-i18n são traduzidos ao abrir (main.js#translateStatic); o português é a chave. -->
  <aside class="side" data-i18n-label="Navegação" aria-label="Navegação">
    <div class="brand">
      <img class="brand-mark" src="/logo.svg" alt="" width="34" height="34">
      <div><b>auto-job-finder</b><span data-i18n>do achado ao envio</span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/vagas" data-route="vagas"><span class="ico">💼</span><span data-i18n>Vagas</span><span class="pill num" id="nav-vagas" hidden></span></a>
      <a href="#/resultados" data-route="resultados"><span class="ico">📊</span><span data-i18n>Resultados</span></a>
      <a href="#/perfil" data-route="perfil"><span class="ico">🪪</span><span data-i18n>Perfil</span><span class="pill warn num" id="nav-perfil" hidden></span></a>
      <a href="#/preferencias" data-route="preferencias"><span class="ico">🎯</span><span data-i18n>Preferências</span></a>
      <a href="#/linkedin" data-route="linkedin"><span class="ico">🔗</span>LinkedIn</a>
      <!-- Só no celular, onde o pé da barra some: abre a paleta (buscar, trocar a IA, mudar o idioma). -->
      <button type="button" class="nav-more" data-act="palette"><span class="ico">⋯</span><span data-i18n>Mais</span></button>
    </nav>
    <div class="side-foot">
      <button type="button" class="cmdk" data-act="palette"><span data-i18n>Buscar ou fazer algo</span> <kbd>Ctrl K</kbd></button>
      <button type="button" class="ia-chip" data-act="ia" id="ia-chip"><span class="dot"></span><span id="ia-label" data-i18n>IA</span></button>
      <button type="button" class="lang-chip" data-act="language" id="lang-chip" data-nolock></button>
    </div>
  </aside>

  <main class="main">
    <div id="offline" class="offline" hidden data-i18n-html>Sem conexão com o <code>ajf</code>. O terminal foi fechado? Rode <code>ajf</code> de novo.</div>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="drawer-root"></div>
<div id="dock-root"></div>
<div id="palette-root"></div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/js/boot.js"></script>
</body>
</html>
