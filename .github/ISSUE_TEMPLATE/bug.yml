name: 🐛 Something doesn't work / Algo não funciona
description: An error, a broken screen or a wrong result. / Um erro, uma tela quebrada ou um resultado errado.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Don't paste personal data**: resumes, contacts, real jobs with names, your `.env` or API keys. Replace them with made-up data. English or Portuguese are both fine.
        Obrigado por reportar! **Não cole dados pessoais**: currículo, contatos, vagas reais com nomes, o seu `.env` ou chaves de API. Troque por dados fictícios. Pode escrever em português ou inglês.
        Security issue? Don't open an issue / Falha de segurança? Não abra issue: see / veja o [SECURITY.md](https://github.com/GabrielMello1407/auto-job-finder/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened / O que aconteceu
      description: And what you expected to happen. / E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce / Como reproduzir
      placeholder: |
        1. I ran `ajf` and opened the Vagas tab / Rodei `ajf` e abri a aba Vagas
        2. I clicked "Gerar pacote" / Cliquei em "Gerar pacote"
        3. This error showed up / Apareceu o erro ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where / Onde
      options:
        - Browser interface / Interface no navegador (ajf)
        - Terminal menu / Menu do terminal (ajf menu)
        - Terminal command / Comando do terminal (ajf <comando>)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / Sistema
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: ia
    attributes:
      label: AI in use / IA em uso
      placeholder: "e.g. Claude (claude CLI), Codex, Gemini CLI, Anthropic API"
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ajf doctor` and Node version (`node -v`) / Saída do `ajf doctor` e versão do Node
      description: Check there are no names, e-mails or paths with personal data before pasting. / Confira se não há nome, e-mail ou caminhos com dados pessoais antes de colar.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Privacidade
      options:
        - label: I checked and there is no personal data of mine or anyone else in this report. / Revisei e não há dados pessoais meus ou de outra pessoa neste relato.
          required: true
